<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Обложки проектов</title><link rel="stylesheet" href="covers.css"><style>@font-face{font-family:Inter;src:url('assets/fonts/Inter.ttf')}*{box-sizing:border-box}body{margin:0;background:#f8f8f3;color:#282923;font-family:Inter,Arial,sans-serif}header{display:flex;justify-content:space-between;padding:35px 5vw;font-size:12px}a{color:inherit;text-decoration:none}h1{font-weight:400;letter-spacing:-.06em;font-size:clamp(38px,5vw,80px);margin:50px 5vw 80px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:65px 35px;padding:0 5vw 80px}.cover-frame{aspect-ratio:4/3}figure{margin:0}figcaption{display:flex;justify-content:space-between;font-size:11px;margin-top:20px}footer{padding:25px 5vw;font-size:11px;line-height:1.8;color:#7f8277;border-top:1px solid #d9dcd1}@media(max-width:800px){main{grid-template-columns:1fr;gap:45px}h1{margin:30px 5vw 50px}}</style><script defer src="covers.js"></script><script defer>window.addEventListener('DOMContentLoaded',()=>{const p=[['red-path','Красный путь'],['credo','Credo'],['global-digital','Global digital group'],['mens-club','Мужской клуб'],['kozikhinsky','Козихинский 22'],['amtek','Амтек'],['dl-studio','dl.studio'],['dl-games','dl.games']];document.querySelector('main').innerHTML=p.map(([id,name])=>`<figure><div class="cover-frame" data-cover="${id}">${PortfolioCovers.markup(id)}</div><figcaption><span>${name}</span><span>↗</span></figcaption></figure>`).join('');});</script></head><body><header><a href="index.html">ac. / Александр Чеботарев</a><a href="motion-directions.html">Первые экраны ↗</a></header><h1>Меньше деталей.<br><i style="font-family:Georgia">Больше характера.</i></h1><main></main><footer>Новая серия обложек: один визуальный акцент на проект.<br>Типографическая серия: знак или короткое название на спокойном фоне. Это концепции обложек для портфолио.</footer></body></html>
